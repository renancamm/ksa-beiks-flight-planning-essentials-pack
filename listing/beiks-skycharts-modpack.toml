spec_version = 1
id = "BeiksSkychartsModpack"
type = "modpack"
name = "Beik's Sky Charts Modpack"
authors = ["Beik"]
abstract = "This is an example of a modpack. It contains three mods that will help you navigate the start in different ways."
tags = ["user-interface"]
description = """
This is an example of a modpack. It contains three mods that will help you navigate the start in different ways!

Inside this pack you will find:
- DeltaVMap: An interactive, auto-generated delta-v subway map and transfer-window planner for Kitten Space Agency.
- OhMyStars: This mod adds constellation lines between stars in KSA!
- Compendium: Compendium adds a window (which may be toggled on/off via ModMenu) which provides a helpful companion to exploring the currently loaded solar system!
"""

